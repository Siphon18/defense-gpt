name: Sync to Hugging Face Hub

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push --force https://aditya043:$HF_TOKEN@huggingface.co/spaces/aditya043/defense-gpt-api master:main
          else
            echo "::warning ::HF_TOKEN secret not configured in repository settings. Skipping Hugging Face sync."
          fi
